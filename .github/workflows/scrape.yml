name: Job Scraper

on:
  # Manual trigger — you choose when to run it
  workflow_dispatch:
    inputs:
      boards:
        description: "Boards to scrape (space-separated, leave empty for all enabled)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (do not persist state or send email)"
        type: boolean
        default: false

  # Scheduled runs — Mon / Wed / Fri at 09:00 UTC (06:00 Argentina)
  schedule:
    - cron: "0 9 * * 1,3,5"

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape Jobs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          # Supabase: use the Connection-pooling (Session pooler) string here.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          LI_AT_COOKIE: ${{ secrets.LI_AT_COOKIE }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.boards }}" ]; then
            ARGS="$ARGS --boards ${{ github.event.inputs.boards }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.main $ARGS
